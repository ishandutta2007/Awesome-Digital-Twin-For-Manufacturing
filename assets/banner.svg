<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="15" />
  
  <!-- Dynamic Glow Effect -->
  <circle cx="200" cy="100" r="150" fill="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="100" r="150" fill="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Grid lines for industrial look -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150" />
    <path d="M 100,0 L 100,200 M 200,0 L 200,200 M 300,0 L 300,200 M 400,0 L 400,200 M 500,0 L 500,200 M 600,0 L 600,200 M 700,0 L 700,200" />
  </g>

  <!-- Title -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#text)" text-anchor="middle" alignment-baseline="middle">
    Awesome Digital Twin
  </text>
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#94a3b8" text-anchor="middle" alignment-baseline="middle" letter-spacing="2">
    F O R   M A N U F A C T U R I N G
  </text>

  <!-- Spinning Gear -->
  <g transform="translate(100, 100) scale(0.6)">
    <g fill="#38bdf8" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite" />
      <path d="M 30,0 A 30,30 0 1,1 -30,0 A 30,30 0 1,1 30,0 M 15,0 A 15,15 0 1,0 -15,0 A 15,15 0 1,0 15,0" fill="#0f172a" />
      <path d="M 40,-10 L 40,10 L 30,15 L 20,40 L -20,40 L -30,15 L -40,10 L -40,-10 L -30,-15 L -20,-40 L 20,-40 L 30,-15 Z" fill="#38bdf8" stroke="#1e293b" stroke-width="2" />
    </g>
  </g>

  <!-- Data Flow Nodes -->
  <g fill="#818cf8">
    <circle cx="700" cy="100" r="5">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="670" cy="70" r="4" opacity="0.6" />
    <circle cx="670" cy="130" r="4" opacity="0.6" />
    <circle cx="730" cy="70" r="4" opacity="0.6" />
    <circle cx="730" cy="130" r="4" opacity="0.6" />
    <path d="M 670,70 L 700,100 M 670,130 L 700,100 M 730,70 L 700,100 M 730,130 L 700,100" stroke="#818cf8" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
